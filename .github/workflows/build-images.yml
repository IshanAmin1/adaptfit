name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - backend/**
  workflow_dispatch:
  
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lower case container name
        run: |
          echo "CONTAINER_NAME_LC=${$GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.CONTAINER_NAME_LC }}/frontend:latest
            ghcr.io/${{ env.CONTAINER_NAME_LC }}/frontend:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.CONTAINER_NAME_LC }}/backend:latest
            ghcr.io/${{ env.CONTAINER_NAME_LC }}/backend:${{ github.sha }}
