name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - backend/**
  workflow_dispatch:
  
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./adaptfit-app
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/adaptfit-app:latest
            ghcr.io/${{ env.OWNER_LC }}/adaptfit-app:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./adaptfit-api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/adaptfit-api:latest
            ghcr.io/${{ env.OWNER_LC }}/adaptfit-api:${{ github.sha }}
