services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html

  nginx-proxy-acme:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-proxy-acme
    restart: always
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme:/etc/acme.sh
    environment:
      DEFAULT_EMAIL: ${DEFAULT_EMAIL}

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend
    restart: always
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      LETSENCRYPT_HOST: ${DOMAIN}

  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production

      VIRTUAL_HOST: api.${DOMAIN}
      LETSENCRYPT_HOST: api.${DOMAIN}

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLIENT_ORIGIN: https://${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://api.${DOMAIN}/auth/google/callback

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID}

      EXERCISE_DB_RAPIDAPI_KEY: ${EXERCISE_DB_RAPIDAPI_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

  worker:
    image: ${BACKEND_IMAGE}
    container_name: worker
    restart: always
    command: npm run start:worker
    environment:
      NODE_ENV: production

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLIENT_ORIGIN: https://${DOMAIN}

      EXERCISE_DB_RAPIDAPI_KEY: ${EXERCISE_DB_RAPIDAPI_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-volume:/var/lib/postgresql/data

  redis:
    image: redis:7.2.5-alpine
    container_name: redis
    restart: always
    volumes:
      - ./adaptfit-api/config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

volumes:
  postgres-volume:
